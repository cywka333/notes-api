spring.application.name=notes-api
spring.jackson.deserialization.fail-on-numbers-for-enums=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notes}
spring.datasource.username=${DB_USERNAME:notes}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.cdi.extensions=true
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

app.login-rate-limit.attempts=${LOGIN_RATE_LIMIT_ATTEMPTS:5}
app.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
