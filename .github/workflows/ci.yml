name: Java CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Start API and MySQL
        run: docker compose up --build -d

      - name: Verify registration through the published API
        shell: bash
        run: |
          url=http://127.0.0.1:8080
          for attempt in {1..60}; do
            if [[ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "$url/items")" == 401 ]]; then
              break
            fi
            sleep 2
          done
          payload=$(jq -nc --arg password "$(openssl rand -hex 16)" '{login:"compose.smoke",password:$password}')
          status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' --data "$payload" "$url/register")
          test "$status" = 201

      - name: Show startup logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Stop the stack
        if: always()
        run: docker compose down
